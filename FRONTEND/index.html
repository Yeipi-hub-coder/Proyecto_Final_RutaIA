<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>RutaIA</title>

    <link
        rel="stylesheet"
        href="css/styles.css"
    >
</head>

<body>

    <main class="login-page">

        <section class="login-container">

            <div class="login-image">

                <img src="imagenes/login.png" class="imagen-login" alt="login-image-art">

            </div>


            <!-- =========================
                 FORMULARIO
            ========================== -->

            <div class="login-form-area">

                <form class="login-form" id="loginForm">

                    <div class="logo-text">
                        RutaIA
                    </div>

                    <p class="login-description">
                        Aprendizaje a un click
                    </p>


                    <div class="form-group">

                        <label>
                            Correo electrónico
                        </label>

                        <input
                            type="email"
                            id="correo"
                            placeholder="Escribe tu correo"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label>
                            Contraseña
                        </label>

                        <input
                            type="password"
                            id="contrasena"
                            placeholder="Ingresa tu contraseña"
                            required
                        >

                    </div>


                    <button
                        class="login-button"
                        type="submit"
                    >
                        Iniciar sesión
                    </button>

                </form>

            </div>

        </section>

    </main>
<script src="js/api.js"></script>
<script src="js/admin.js"></script>
<script src="js/sesion.js"></script>
<script src="js/login.js"></script>
</body>

</html>
