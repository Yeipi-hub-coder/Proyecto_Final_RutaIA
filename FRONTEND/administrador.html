<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Administradror_IA
    </title>

    <link
        rel="stylesheet"
        href="css/styles.css"
    >

</head>


<body>


<div class="dashboard">


    <!-- =================================
         SIDEBAR
    ================================== -->

    <aside class="sidebar">

        <div class="sidebar-logo">
            Ruta IA
        </div>


        <nav class="sidebar-menu">


            <a
                href="#"
                class="active"
            >
                <span class="menu-icon">⌂</span>
                Inicio
            </a>


            <a href="#">
                <span class="menu-icon">▤</span>
                Gestionar cursos
            </a>


            <a href="#">
                <span class="menu-icon">♙</span>
                Gestionar estudiantes
            </a>


            <a href="#">
                <span class="menu-icon">◴</span>
                Historial de consultas
            </a>


            <a href="#">
                <span class="menu-icon">▥</span>
                Estadísticas
            </a>


            <a href="#">
                <span class="menu-icon">⚙</span>
                Configuración
            </a>

        </nav>

    </aside>


    <!-- =================================
         CONTENIDO PRINCIPAL
    ================================== -->

    <main class="main-content">


        <!-- TOP BAR -->

        <header class="topbar">

            <div class="search">

                <input
                    type="text"
                    placeholder="Buscar cursos, estudiantes, reportes..."
                >

            </div>


            <div class="profile">

                <div class="profile-avatar">
                    AD
                </div>

                <div>

                    <div class="profile-name">
                        Administrador
                    </div>

                    <div class="profile-role">
                        Administrador
                    </div>

                </div>

            </div>

        </header>


        <div class="content-wrapper">


            <!-- =================================
                 HERO
            ================================== -->

            <section class="hero">

                <div class="panel_admin">

                    <h1 >
                        Panel de Administrador
                    </h1>

                    <p class="hero-description">
                        Gracias por hacer posible
                        una mejor educación.
                    </p>
                </div>
                <div class="imagen-container">
                    <img src="imagenes/admin.png" class="imagen-estudiante" alt="">
                </div>
            </section>


            <!-- =================================
                 GESTION
            ================================== -->

            <div class="manage-title">

                <h2 class="section-title">
                    Gestionar
                </h2>

            </div>


            <section class="manage-grid">


                <!-- CURSOS -->

                <a
                    href="#"
                    class="manage-card"
                >

                    <div class="manage-icon">
                        <img src="imagenes/Gestion_icon.png" alt="">
                    </div>


                    <div class="manage-info">

                        <h3>
                            Gestionar cursos
                        </h3>

                    </div>


                    <div class="manage-arrow">
                        →
                    </div>

                </a>


                <!-- ESTUDIANTES -->

                <a
                    href="#"
                    class="manage-card"
                >

                    <div class="manage-icon">
                       <img src="imagenes/estudiante_icon.webp" alt="">
                    </div>


                    <div class="manage-info">

                        <h3>
                            Gestionar estudiantes
                        </h3>

                    </div>


                    <div class="manage-arrow">
                        →
                    </div>

                </a>

            </section>


            <!-- =================================
                 ESTADISTICAS
            ================================== -->

            <div class="stats-section-header">

                <h2 class="section-title">
                    Estadísticas
                </h2>

            </div>


            <section class="stats-grid">

                    <div class="stat-card" id="totalCursos">
                        
                    </div>         

                    <div class="stat-card" id="totalEstudiantes">
                        
                    </div>  

                    <div class="stat-card" id="totalConsultas">
                        
                    </div>  

                    <div class="stat-card" id="promedioCalificaciones">
                        
                    </div>  
             

            </section>

        </div>

    </main>

</div>
<script src="js/api.js"></script>
<script src="js/admin.js"></script>
</body>

</html>
