<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Estudiantes_IA
    </title>

    <link
        rel="stylesheet"
        href="css/styles.css"
    >

</head>


<body>

<div class="dashboard">

    <!-- =================================
         SIDEBAR
    ================================== -->

    <aside class="sidebar">

        <div class="sidebar-logo">
            Ruta IA
        </div>


        <nav class="sidebar-menu">

            <a
                href="#"
                class="active"
            >
                <span class="menu-icon">⌂</span>
                Inicio
            </a>


            <a href="#">
                <span class="menu-icon">▤</span>
                Todos los cursos
            </a>


            <a href="#">
                <span class="menu-icon">▶</span>
                Cursos en progreso
            </a>


            <a href="#">
                <span class="menu-icon">▥</span>
                Calificaciones
            </a>


            <a href="chatbox.html">
                <span class="menu-icon">☵</span>
                Chatbox de cursos
            </a>


            <a href="#">
                <span class="menu-icon">◴</span>
                Estadísticas
            </a>

        </nav>

    </aside>


    <!-- =================================
         CONTENIDO
    ================================== -->

    <main class="main-content">


        <!-- TOP -->

        <header class="topbar">

            <div class="search">

                <input
                    type="text"
                    placeholder="Buscar cursos, tareas, recursos..."
                >

            </div>


            <div class="profile">

                <div class="profile-avatar">
                    SR
                </div>

                <div>

                    <div class="profile-name">
                        Sofía Ramírez
                    </div>

                    <div class="profile-role">
                        Estudiante
                    </div>

                </div>

            </div>

        </header>


        <div class="content-wrapper">


            <!-- =================================
                 BANNER
            ================================== -->

            <section class="hero">

                <div class="hero-content">

                    <h1>
                        ¡Hola Estudiante!
                    </h1>

                    <p class="hero-description">
                        Que la curiosidad te acompañe hoy.
                    </p>

                    <p class="hero-small">
                        Pequeños avances, grandes futuros.
                    </p>

                </div>

                <div class="imagen-container">
                    <img src="imagenes/Estudiante.png" class="imagen-estudiante" alt="">
                </div>

            </section>


            <!-- =================================
                 CURSOS + NOTAS
            ================================== -->

            <section class="student-grid">


                <!-- CURSOS -->

                <article class="card">

                    <div class="card-header acordeon-header" onclick="toggleCursos()">

                        <h2>
                            Cursos en progreso
                        </h2>

                    </div>


                   <div class="course-list" id="listaCursos">

                   </div>

                </article>


                <!-- =================================
                     CALIFICACIONES
                ================================== -->

                <article class="card">

                    <div class="card-consult">

                        <h2>
                            Historial de Consultas
                        </h2>
                        
                    </div>

                </article>

            </section>

        </div>

    </main>

</div>
<script src="js/api.js"></script>
<script src="js/estudiante.js"></script>
</body>

</html>
